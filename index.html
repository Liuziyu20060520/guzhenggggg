<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#03050a" />
  <title>青花瓷 · 星河古筝</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main id="app" aria-label="星空古筝互动演奏">
    <canvas id="scene" aria-label="古筝琴弦与指尖提示点"></canvas>
    <video id="camera" playsinline muted></video>
    <div class="controls" aria-label="演奏控制">
      <button id="cameraBtn" class="primary" type="button">开启摄像头</button>
      <button id="playBtn" type="button">自动演示</button>
      <button id="resetBtn" type="button">重新开始</button>
      <label class="volume" for="volume"><span>音量</span><input id="volume" type="range" min="0" max="100" value="68" /></label>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="app.js"></script>
</body>
</html>
